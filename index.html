<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>점잇기 대결</title>
<style>
:root{--bg:#f5f4ef;--fg:#1d1d1b;--card:#fff;--line:#dcdacf;--mu:#77756c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ececea;--card:#232327;--line:#3a3a40;--mu:#9a9aa2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ececea;--card:#232327;--line:#3a3a40;--mu:#9a9aa2;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;min-height:100vh}
h1{font-size:18px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;width:min(96vw,900px);font-size:14px}
.bar input[type=range]{width:110px;vertical-align:middle}
select,button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
button.on{background:var(--fg);color:var(--bg)}
#st{display:flex;gap:8px;align-items:center;font-size:17px;font-weight:600;min-height:30px;flex-wrap:wrap;justify-content:center}
.chip{width:16px;height:16px;border-radius:50%;display:inline-block}
.sub{font-size:13px;color:var(--mu);font-weight:400}
.stage{position:relative;width:min(96vw,900px)}
#bd{width:100%;height:auto;display:block;background:var(--card);border:2px solid var(--line);border-radius:12px;touch-action:manipulation}
.hit{cursor:pointer}
.nl{stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr .4s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border-radius:12px}
#ov .card{text-align:center;padding:20px 28px}
#ov h2{margin:0 0 6px}
.hint{font-size:12px;color:var(--mu);width:min(96vw,900px);text-align:center;margin:0}
</style></head><body>
<h1>점잇기 대결</h1>
<div class="bar card">
  <label>상대 <select id="mode"><option value="pc">컴퓨터와 대결</option><option value="pp">사람과 사람</option></select></label>
  <label id="fl">선공 <select id="first"><option value="0">내가 먼저</option><option value="1">컴퓨터가 먼저</option></select></label>
  <label id="lvl">난이도 <input type="range" id="lv" min="1" max="30" value="10"> <b id="lvn">10</b>단계</label>
  <label>점 <input type="range" id="dn" min="20" max="60" value="35"> <b id="dnn">35</b>개</label>
  <label><input type="checkbox" id="hint"> 남은 선 수 보기</label>
  <button id="nw">새 게임</button>
</div>
<div id="st"></div>
<div class="stage">
  <svg id="bd" viewBox="0 0 1000 640"></svg>
  <div id="ov"><div class="card"><h2 id="rt"></h2><div id="rs" class="sub"></div><div style="margin-top:12px"><button id="again" class="on">다시 하기</button></div></div></div>
</div>
<p class="hint">점 하나를 누르고 다른 점을 눌러 직선을 그어요. 선은 다른 선과 교차하거나 다른 점을 지나갈 수 없고, 같은 두 점은 한 번만 이을 수 있어요. 한 번 쓴 점은 누구도 다시 쓸 수 없어요. 자기 차례에 더 이상 그을 선이 없으면 져요.</p>
<script>
const $=s=>document.querySelector(s),VW=1000,VH=640,COLS=['#1c7ed6','#e8590c'];
let dots=[],pairs=[],legal=[],legalSet=new Set(),lines=[],turn=0,sel=-1,over=false,fresh=-1,msg='',gid=0,own=[];
const cfg=()=>({pc:$('#mode').value==='pc',first:+$('#first').value,level:+$('#lv').value,n:+$('#dn').value});
const names=()=>{const c=cfg();return c.pc?(c.first===0?['나','컴퓨터']:['컴퓨터','나']):['1P','2P']};
const isAI=t=>{const c=cfg();return c.pc&&t===(c.first===0?1:0)};
const rnd=a=>Math.floor(Math.random()*a);

// ---------- 기하 ----------
function dseg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
const cr=(o,p,q)=>(p.x-o.x)*(q.y-o.y)-(p.y-o.y)*(q.x-o.x);
function conflict(m,l){
  if(m.a===l.a||m.a===l.b||m.b===l.a||m.b===l.b)return false;
  const A=dots[m.a],B=dots[m.b],C=dots[l.a],D=dots[l.b];
  return cr(A,B,C)*cr(A,B,D)<=0&&cr(C,D,A)*cr(C,D,B)<=0}
function mkDots(n){
  let md=Math.sqrt(VW*VH/n)*.6,tries=0;dots=[];
  while(dots.length<n){
    const p={x:40+Math.random()*(VW-80),y:40+Math.random()*(VH-80)};
    if(dots.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>=md))dots.push(p);
    if(++tries>4000){tries=0;md*=.93}}}
function mkPairs(){
  pairs=[];
  for(let i=0;i<dots.length;i++)for(let j=i+1;j<dots.length;j++){
    let ok=true;
    for(let k=0;k<dots.length;k++)if(k!==i&&k!==j&&dseg(dots[k],dots[i],dots[j])<16){ok=false;break}
    if(ok)pairs.push({a:i,b:j,k:i+'-'+j})}}

// ---------- 컴퓨터 ----------
let nodes=0;
function win(L){
  if(!L.length)return false;
  if(++nodes>40000)throw 0;
  for(const m of L)if(!win(L.filter(x=>x!==m&&!conflict(x,m))))return true;
  return false}
function solve(L){
  nodes=0;
  try{for(const m of L)if(!win(L.filter(x=>x!==m&&!conflict(x,m))))return m}catch(e){}
  return null}
function aiPick(level){
  const L=legal,p=(level-1)/29;
  if(Math.random()>.12+.88*p)return L[rnd(L.length)];
  if(L.length<=6+Math.floor(level/3)){const r=solve(L);if(r)return r}
  const cand=L.length>45?Array.from({length:45},()=>L[rnd(L.length)]):L;
  let best=null,bc=1e9;
  for(const m of cand){const c=L.filter(x=>x!==m&&!conflict(x,m)).length+Math.random()*(1-p)*4;if(c<bc){bc=c;best=m}}
  return best}
function aiTurn(){
  const g=gid;
  setTimeout(()=>{if(g!==gid||over)return;const m=aiPick(cfg().level);play(m.a,m.b)},650)}

// ---------- 점 소유 규칙 (아래 함수들이 위의 win/solve/aiPick을 대체) ----------
const okf=(x,o,t)=>o[x.a]<0&&o[x.b]<0;
const forP=t=>legal.filter(x=>okf(x,own,t));
function win(L,o,t){
  const M=L.filter(x=>okf(x,o,t));
  if(!M.length)return false;
  if(++nodes>40000)throw 0;
  for(const m of M){
    const o2=o.slice();o2[m.a]=o2[m.b]=t;
    const L2=L.filter(x=>x!==m&&!conflict(x,m)&&(okf(x,o2,0)||okf(x,o2,1)));
    if(!win(L2,o2,1-t))return true}
  return false}
function solve(L,t){
  nodes=0;
  try{for(const m of L.filter(x=>okf(x,own,t))){
    const o2=own.slice();o2[m.a]=o2[m.b]=t;
    const L2=L.filter(x=>x!==m&&!conflict(x,m)&&(okf(x,o2,0)||okf(x,o2,1)));
    if(!win(L2,o2,1-t))return m}}catch(e){}
  return null}
function aiPick(level){
  const t=turn,M=forP(t),p=(level-1)/29;
  if(Math.random()>.12+.88*p)return M[rnd(M.length)];
  const rel=legal.filter(x=>okf(x,own,0)||okf(x,own,1));
  if(rel.length<=6+Math.floor(level/3)){const r=solve(rel,t);if(r)return r}
  const cand=M.length>45?Array.from({length:45},()=>M[rnd(M.length)]):M;
  let best=null,bc=1e9;
  for(const m of cand){
    const o2=own.slice();o2[m.a]=o2[m.b]=t;let me=0,op=0;
    for(const x of legal){if(x===m||conflict(x,m))continue;if(okf(x,o2,t))me++;if(okf(x,o2,1-t))op++}
    const c=me+Math.random()*(1-p)*6;if(c<bc){bc=c;best=m}}
  return best}

// ---------- 진행 ----------
function play(a,b){
  const key=Math.min(a,b)+'-'+Math.max(a,b),m=legal.find(x=>x.k===key);
  if(!m)return;
  lines.push({a:m.a,b:m.b,t:turn});own[m.a]=own[m.b]=turn;
  legal=legal.filter(x=>x!==m&&!conflict(x,m));legalSet=new Set(legal.map(x=>x.k));
  fresh=lines.length-1;sel=-1;msg='';turn=1-turn;
  if(!forP(turn).length){over=true;const w=1-turn;
    $('#rt').innerHTML='<span class="chip" style="background:'+COLS[w]+'"></span> '+names()[w]+' 승리!';
    $('#rs').textContent=names()[turn]+' 차례에 더 이상 그을 선이 없어요 · 총 '+lines.length+'개의 선';
    setTimeout(()=>{if(over)$('#ov').style.display='flex'},600)}
  render();
  if(!over&&isAI(turn))aiTurn()}
function onDot(i){
  if(over||isAI(turn))return;
  if(sel<0){if(own[i]>=0){msg='이미 사용한 점이에요';render();return}sel=i;msg='';render();return}
  if(sel===i){sel=-1;render();return}
  const key=Math.min(sel,i)+'-'+Math.max(sel,i);
  if(own[i]>=0){sel=-1;msg='이미 사용한 점은 다시 이을 수 없어요';render();return}
  if(legalSet.has(key)){play(sel,i);return}
  sel=-1;msg='그을 수 없는 선이에요 (교차하거나 점을 지나가거나 이미 이어진 점)';render()}
function render(){
  const alive=new Set();legal.forEach(m=>{if(okf(m,own,0)||okf(m,own,1)){alive.add(m.a);alive.add(m.b)}});
  const cand=new Set();
  if(sel>=0)for(let j=0;j<dots.length;j++)if(legalSet.has(Math.min(sel,j)+'-'+Math.max(sel,j))&&own[j]<0)cand.add(j);
  const col=COLS[turn];let h='';
  lines.forEach((l,i)=>{const A=dots[l.a],B=dots[l.b];
    h+='<line x1="'+A.x+'" y1="'+A.y+'" x2="'+B.x+'" y2="'+B.y+'" stroke="'+COLS[l.t]+'" stroke-width="5" stroke-linecap="round"'+(i===fresh?' class="nl"':'')+'/>'});
  dots.forEach((p,i)=>{const s=i===sel,c=cand.has(i);
    h+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(s?12:8)+'" fill="'+(own[i]>=0?COLS[own[i]]:'var(--card)')+'" stroke="'+(s||c?col:'var(--fg)')+'" stroke-width="'+(s?5:c?4:2.5)+'" opacity="'+(alive.has(i)||own[i]>=0?1:.35)+'"'+(c?' stroke-dasharray="4 3"':'')+'/>'+
       '<circle class="hit" data-i="'+i+'" cx="'+p.x+'" cy="'+p.y+'" r="20" fill="transparent"/>'});
  $('#bd').innerHTML=h;
  let st=over?'게임 끝':'<span class="chip" style="background:'+col+'"></span>'+names()[turn]+' 차례'+(isAI(turn)?' (생각 중…)':'');
  if($('#hint').checked)st+=' <span class="sub">· 이번 차례가 그을 수 있는 선 '+forP(turn).length+'개</span>';
  if(msg)st+=' <span class="sub">· '+msg+'</span>';
  $('#st').innerHTML=st}
function newGame(){
  gid++;const c=cfg();
  $('#fl').style.display=$('#lvl').style.display=c.pc?'':'none';
  mkDots(c.n);mkPairs();lines=[];own=dots.map(()=>-1);legal=pairs.slice();legalSet=new Set(legal.map(m=>m.k));
  turn=0;sel=-1;over=false;fresh=-1;msg='';$('#ov').style.display='none';render();
  if(isAI(0))aiTurn()}
$('#bd').addEventListener('click',e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!==undefined)onDot(+i)});
$('#lv').oninput=e=>$('#lvn').textContent=e.target.value;
$('#dn').oninput=e=>$('#dnn').textContent=e.target.value;
['mode','first','lv','dn'].forEach(id=>$('#'+id).onchange=newGame);
$('#hint').onchange=render;$('#nw').onclick=newGame;$('#again').onclick=newGame;
newGame();
</script></body></html>
